<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>EV Technician Hub - Admin</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f3f5f7;
  color:#111;
}

.container{
  max-width:1000px;
  margin:auto;
  padding:20px;
}

.header{
  background:#111;
  color:white;
  padding:20px;
  border-radius:14px;
  margin-bottom:20px;
}

.header h1{
  margin:0 0 6px;
}

.card{
  background:white;
  padding:20px;
  border-radius:14px;
  margin-bottom:20px;
  box-shadow:0 3px 12px rgba(0,0,0,.08);
}

input,
textarea,
select,
button{
  width:100%;
  padding:12px;
  margin:7px 0;
  border-radius:8px;
  border:1px solid #ccc;
  font-size:15px;
}

textarea{
  min-height:160px;
  resize:vertical;
}

button{
  background:#111;
  color:white;
  cursor:pointer;
  border:none;
}

button:hover{
  opacity:.9;
}

.btn-secondary{
  background:#555;
}

.btn-danger{
  background:#c62828;
}

.btn-green{
  background:#16833b;
}

#dashboard{
  display:none;
}

.blog-item{
  border:1px solid #ddd;
  padding:15px;
  border-radius:10px;
  margin-top:12px;
}

.blog-item h3{
  margin-top:0;
}

.status{
  font-weight:bold;
}

.message{
  font-weight:bold;
  margin-top:10px;
}

.stats{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:12px;
}

.stat{
  background:#f0f2f4;
  padding:18px;
  border-radius:10px;
  text-align:center;
}

.stat strong{
  display:block;
  font-size:28px;
}

.hidden{
  display:none;
}

@media(max-width:600px){
  .stats{
    grid-template-columns:1fr;
  }
}
</style>
</head>

<body>

<div class="container">

  <div class="header">
    <h1>⚡ EV Technician Hub</h1>
    <p>Admin Control Panel</p>
  </div>


  <!-- LOGIN -->
  <div class="card" id="loginBox">

    <h2>Admin Login</h2>

    <p>
      Login using your authorized GitHub account.
    </p>

    <button onclick="loginWithGitHub()">
      Login with GitHub
    </button>

    <p id="loginMessage" class="message"></p>

  </div>


  <!-- DASHBOARD -->
  <div id="dashboard">

    <div class="card">

      <h2>Admin Dashboard</h2>

      <p id="adminName"></p>

      <button class="btn-secondary" onclick="logout()">
        Logout
      </button>

    </div>


    <!-- STATS -->
    <div class="card">

      <h2>Website Statistics</h2>

      <div class="stats">

        <div class="stat">
          <strong id="blogCount">0</strong>
          Blogs
        </div>

        <div class="stat">
          <strong id="publishedCount">0</strong>
          Published
        </div>

        <div class="stat">
          <strong id="draftCount">0</strong>
          Drafts
        </div>

      </div>

    </div>


    <!-- ADD BLOG -->
    <div class="card">

      <h2 id="formTitle">Add New Blog</h2>

      <input
        id="title"
        placeholder="Blog title"
      >

      <input
        id="slug"
        placeholder="Slug e.g. ev-battery-testing"
      >

      <input
        id="excerpt"
        placeholder="Short description"
      >

      <input
        id="category"
        placeholder="Category e.g. Battery, Motor, BMS"
      >

      <input
        id="image_url"
        placeholder="Image URL (optional)"
      >

      <textarea
        id="content"
        placeholder="Write your blog content here..."
      ></textarea>

      <select id="status">

        <option value="draft">
          Draft
        </option>

        <option value="published">
          Published
        </option>

      </select>

      <button
        class="btn-green"
        onclick="saveBlog()"
      >
        Save Blog
      </button>

      <button
        class="btn-secondary"
        onclick="clearForm()"
      >
        Clear
      </button>

      <p id="saveMessage" class="message"></p>

    </div>


    <!-- BLOG LIST -->
    <div class="card">

      <h2>Manage Blogs</h2>

      <button onclick="loadBlogs()">
        Refresh Blogs
      </button>

      <div id="blogList">
        Loading...
      </div>

    </div>

  </div>

</div>


<script>

/* ==============================
   SUPABASE CONFIG
============================== */

const SUPABASE_URL =
"https://wwibocfzmuhflddkhygo.supabase.co";

const SUPABASE_KEY =
"sb_publishable_K7pmzot-hdAAPUgIubrG-w_7nNTAGvY";

const supabaseClient =
supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);


/* ==============================
   VARIABLES
============================== */

let editingBlogId = null;


/* ==============================
   GITHUB LOGIN
============================== */

async function loginWithGitHub(){

  const redirectUrl =
    window.location.origin +
    window.location.pathname;

  const { error } =
    await supabaseClient.auth.signInWithOAuth({

      provider:"github",

      options:{
        redirectTo:redirectUrl
      }

    });

  if(error){

    document.getElementById(
      "loginMessage"
    ).textContent = error.message;

  }

}


/* ==============================
   CHECK ADMIN
============================== */

async function checkAdmin(){

  const {
    data,
    error
  } =
  await supabaseClient.auth.getSession();

  if(error || !data.session){

    showLogin();

    return;

  }


  const user =
    data.session.user;


  const {
    data:profile,
    error:profileError
  } =
  await supabaseClient
    .from("profiles")
    .select("name,role")
    .eq("id",user.id)
    .single();


  if(
    profileError ||
    !profile ||
    profile.role !== "admin"
  ){

    document.getElementById(
      "loginMessage"
    ).textContent =
      "You are not authorized as an admin.";

    await supabaseClient.auth.signOut();

    showLogin();

    return;

  }


  document.getElementById(
    "adminName"
  ).textContent =
    "Logged in as: " +
    (profile.name || user.email);


  showDashboard();

  loadBlogs();

}


/* ==============================
   SHOW LOGIN
============================== */

function showLogin(){

  document.getElementById(
    "loginBox"
  ).style.display="block";

  document.getElementById(
    "dashboard"
  ).style.display="none";

}


/* ==============================
   SHOW DASHBOARD
============================== */

function showDashboard(){

  document.getElementById(
    "loginBox"
  ).style.display="none";

  document.getElementById(
    "dashboard"
  ).style.display="block";

}


/* ==============================
   LOGOUT
============================== */

async function logout(){

  await supabaseClient.auth.signOut();

  location.reload();

}


/* ==============================
   SAVE BLOG
============================== */

async function saveBlog(){

  const title =
    document.getElementById("title").value.trim();

  const slug =
    document.getElementById("slug").value.trim();

  const excerpt =
    document.getElementById("excerpt").value.trim();

  const category =
    document.getElementById("category").value.trim();

  const image_url =
    document.getElementById("image_url").value.trim();

  const content =
    document.getElementById("content").value.trim();

  const status =
    document.getElementById("status").value;


  if(!title || !content){

    document.getElementById(
      "saveMessage"
    ).textContent =
      "Please enter title and content.";

    return;

  }


  document.getElementById(
    "saveMessage"
  ).textContent =
    "Saving...";


  const blogData = {

    title:title,

    slug:slug || null,

    excerpt:excerpt || null,

    content:content,

    image_url:image_url || null,

    category:category || null,

    status:status,

    updated_at:new Date().toISOString()

  };


  let result;


  if(editingBlogId){

    result =
      await supabaseClient
        .from("blogs")
        .update(blogData)
        .eq("id",editingBlogId);

  }

  else{

    blogData.author =
      "EV Technician Hub";

    result =
      await supabaseClient
        .from("blogs")
        .insert([blogData]);

  }


  if(result.error){

    document.getElementById(
      "saveMessage"
    ).textContent =
      result.error.message;

    return;

  }


  document.getElementById(
    "saveMessage"
  ).textContent =
    editingBlogId
      ? "Blog updated successfully."
      : "Blog added successfully.";


  clearForm();

  loadBlogs();

}


/* ==============================
   LOAD BLOGS
============================== */

async function loadBlogs(){

  const list =
    document.getElementById("blogList");

  list.innerHTML =
    "Loading blogs...";


  const {
    data,
    error
  } =
  await supabaseClient
    .from("blogs")
    .select("*")
    .order("created_at",{ascending:false});


  if(error){

    list.innerHTML =
      "<p>Error: " +
      escapeHtml(error.message) +
      "</p>";

    return;

  }


  updateStats(data);


  if(!data || data.length === 0){

    list.innerHTML =
      "<p>No blogs added yet.</p>";

    return;

  }


  list.innerHTML = "";


  data.forEach(blog => {

    const div =
      document.createElement("div");

    div.className="blog-item";


    div.innerHTML = `

      <h3>
        ${escapeHtml(blog.title || "")}
      </h3>

      <p>
        ${escapeHtml(blog.excerpt || "")}
      </p>

      <p>
        Category:
        ${escapeHtml(blog.category || "-")}
      </p>

      <p class="status">
        Status:
        ${escapeHtml(blog.status || "")}
      </p>

      <button
        onclick="editBlog(${blog.id})">
        Edit
      </button>

      <button
        class="btn-danger"
        onclick="deleteBlog(${blog.id})">
        Delete
      </button>

      <button
        class="btn-green"
        onclick="changeStatus(${blog.id},
        '${blog.status === "published"
          ? "draft"
          : "published"}')">

        ${blog.status === "published"
          ? "Move to Draft"
          : "Publish"}

      </button>

    `;


    list.appendChild(div);

  });

}


/* ==============================
   UPDATE STATS
============================== */

function updateStats(blogs){

  const total =
    blogs ? blogs.length : 0;

  const published =
    blogs
      ? blogs.filter(
          b => b.status === "published"
        ).length
      : 0;

  const drafts =
    total - published;


  document.getElementById(
    "blogCount"
  ).textContent = total;

  document.getElementById(
    "publishedCount"
  ).textContent = published;

  document.getElementById(
    "draftCount"
  ).textContent = drafts;

}


/* ==============================
   EDIT BLOG
============================== */

async function editBlog(id){

  const {
    data,
    error
  } =
  await supabaseClient
    .from("blogs")
    .select("*")
    .eq("id",id)
    .single();


  if(error){

    alert(error.message);

    return;

  }


  editingBlogId = id;


  document.getElementById(
    "formTitle"
  ).textContent =
    "Edit Blog";


  document.getElementById(
    "title"
  ).value =
    data.title || "";


  document.getElementById(
    "slug"
  ).value =
    data.slug || "";


  document.getElementById(
    "excerpt"
  ).value =
    data.excerpt || "";


  document.getElementById(
    "category"
  ).value =
    data.category || "";


  document.getElementById(
    "image_url"
  ).value =
    data.image_url || "";


  document.getElementById(
    "content"
  ).value =
    data.content || "";


  document.getElementById(
    "status"
  ).value =
    data.status || "draft";


  window.scrollTo({
    top:0,
    behavior:"smooth"
  });

}


/* ==============================
   DELETE BLOG
============================== */

async function deleteBlog(id){

  if(
    !confirm(
      "Are you sure you want to delete this blog?"
    )
  ){

    return;

  }


  const {
    error
  } =
  await supabaseClient
    .from("blogs")
    .delete()
    .eq("id",id);


  if(error){

    alert(error.message);

    return;

  }


  loadBlogs();

}


/* ==============================
   CHANGE STATUS
============================== */

async function changeStatus(
  id,
  newStatus
){

  const {
    error
  } =
  await supabaseClient
    .from("blogs")
    .update({
      status:newStatus,
      updated_at:new Date().toISOString()
    })
    .eq("id",id);


  if(error){

    alert(error.message);

    return;

  }


  loadBlogs();

}


/* ==============================
   CLEAR FORM
============================== */

function clearForm(){

  editingBlogId = null;


  document.getElementById(
    "formTitle"
  ).textContent =
    "Add New Blog";


  document.getElementById(
    "title"
  ).value="";


  document.getElementById(
    "slug"
  ).value="";


  document.getElementById(
    "excerpt"
  ).value="";


  document.getElementById(
    "category"
  ).value="";


  document.getElementById(
    "image_url"
  ).value="";


  document.getElementById(
    "content"
  ).value="";


  document.getElementById(
    "status"
  ).value="draft";

}


/* ==============================
   HTML SECURITY
============================== */

function escapeHtml(text){

  return String(text)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


/* ==============================
   START
============================== */

checkAdmin();

</script>

</body>
</html>
