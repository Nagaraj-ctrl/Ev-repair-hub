<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>EV Technician Hub - Admin</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f7f9;
      color: #222;
    }

    header {
      background: #111827;
      color: white;
      padding: 18px;
      text-align: center;
    }

    .container {
      max-width: 1100px;
      margin: 30px auto;
      padding: 15px;
    }

    .card {
      background: white;
      padding: 25px;
      border-radius: 12px;
      margin-bottom: 20px;
      box-shadow: 0 3px 12px rgba(0,0,0,0.08);
    }

    h2 {
      margin-top: 0;
    }

    input,
    textarea,
    select {
      width: 100%;
      padding: 12px;
      margin: 8px 0 15px;
      border: 1px solid #ccc;
      border-radius: 7px;
      font-size: 15px;
    }

    textarea {
      min-height: 150px;
      resize: vertical;
    }

    button {
      border: none;
      padding: 11px 18px;
      border-radius: 7px;
      cursor: pointer;
      font-size: 14px;
      margin: 4px;
    }

    .primary {
      background: #16a34a;
      color: white;
    }

    .danger {
      background: #dc2626;
      color: white;
    }

    .secondary {
      background: #374151;
      color: white;
    }

    .edit {
      background: #2563eb;
      color: white;
    }

    .hidden {
      display: none;
    }

    .message {
      margin-top: 10px;
      font-weight: bold;
    }

    .blog {
      border: 1px solid #ddd;
      padding: 15px;
      border-radius: 8px;
      margin-bottom: 12px;
    }

    .blog h3 {
      margin-top: 0;
    }

    .stats {
      display: flex;
      gap: 15px;
      flex-wrap: wrap;
    }

    .stat {
      flex: 1;
      min-width: 150px;
      background: #eef2ff;
      padding: 18px;
      border-radius: 10px;
      text-align: center;
    }

    .stat strong {
      display: block;
      font-size: 25px;
      margin-top: 5px;
    }
  </style>
</head>

<body>

<header>
  <h1>⚡ EV Technician Hub</h1>
  <p>Admin Control Panel</p>
</header>

<div class="container">

  <!-- LOGIN -->
  <div id="loginSection" class="card">

    <h2>Admin Login</h2>

    <label>Email</label>
    <input
      type="email"
      id="email"
      placeholder="Enter your Supabase email"
    >

    <label>Password</label>
    <input
      type="password"
      id="password"
      placeholder="Enter your password"
    >

    <button class="primary" onclick="login()">
      Login
    </button>

    <div id="loginMessage" class="message"></div>

  </div>


  <!-- ADMIN DASHBOARD -->
  <div id="dashboard" class="hidden">

    <div class="card">

      <h2>⚡ Admin Dashboard</h2>

      <p>
        Logged in as:
        <strong id="adminEmail"></strong>
      </p>

      <button class="danger" onclick="logout()">
        Logout
      </button>

    </div>


    <!-- STATS -->
    <div class="card">

      <h2>Website Statistics</h2>

      <div class="stats">

        <div class="stat">
          Blogs
          <strong id="blogCount">0</strong>
        </div>

        <div class="stat">
          Published
          <strong id="publishedCount">0</strong>
        </div>

        <div class="stat">
          Drafts
          <strong id="draftCount">0</strong>
        </div>

      </div>

    </div>


    <!-- ADD / EDIT BLOG -->
    <div class="card">

      <h2 id="formTitle">Add New Blog</h2>

      <input type="hidden" id="editId">

      <label>Blog Title</label>
      <input
        type="text"
        id="title"
        placeholder="Example: How to Test an EV Motor"
      >

      <label>Slug</label>
      <input
        type="text"
        id="slug"
        placeholder="how-to-test-ev-motor"
      >

      <label>Excerpt</label>
      <textarea
        id="excerpt"
        placeholder="Short description of the blog"
      ></textarea>

      <label>Blog Content</label>
      <textarea
        id="content"
        placeholder="Write your technical article here..."
      ></textarea>

      <label>Image URL</label>
      <input
        type="text"
        id="image_url"
        placeholder="Optional image URL"
      >

      <label>Category</label>
      <input
        type="text"
        id="category"
        placeholder="Battery / BMS / Motor / Troubleshooting"
      >

      <label>Author</label>
      <input
        type="text"
        id="author"
        value="EV Technician Hub"
      >

      <label>Status</label>

      <select id="status">
        <option value="draft">Draft</option>
        <option value="published">Published</option>
      </select>

      <br>

      <button class="primary" onclick="saveBlog()">
        Save Blog
      </button>

      <button class="secondary" onclick="clearForm()">
        Clear
      </button>

      <div id="blogMessage" class="message"></div>

    </div>


    <!-- BLOG LIST -->
    <div class="card">

      <h2>Manage Blogs</h2>

      <div id="blogList">
        Loading blogs...
      </div>

    </div>

  </div>

</div>


<script>

  // ==============================
  // SUPABASE CONFIGURATION
  // ==============================

  const SUPABASE_URL =
    "https://wwibocfzmuhflddkhygo.supabase.co";

  const SUPABASE_KEY =
    "sb_publishable_K7pmzot-hdAAPUgIubrG-w_7nNTAGvY";

  const supabaseClient =
    window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );


  // ==============================
  // LOGIN
  // ==============================

  async function login() {

    const email =
      document.getElementById("email").value.trim();

    const password =
      document.getElementById("password").value;

    const message =
      document.getElementById("loginMessage");

    message.textContent = "";

    if (!email || !password) {

      message.textContent =
        "Please enter email and password.";

      return;
    }

    const { data, error } =
      await supabaseClient.auth.signInWithPassword({
        email: email,
        password: password
      });

    if (error) {

      message.textContent =
        "Login failed: " + error.message;

      return;
    }

    await checkAdmin();

  }


  // ==============================
  // CHECK ADMIN
  // ==============================

  async function checkAdmin() {

    const {
      data: { session }
    } = await supabaseClient.auth.getSession();


    if (!session) {

      document
        .getElementById("loginSection")
        .classList.remove("hidden");

      document
        .getElementById("dashboard")
        .classList.add("hidden");

      return;
    }


    const user = session.user;


    // Get user's profile
    const { data: profile, error } =
      await supabaseClient
        .from("profiles")
        .select("role,name")
        .eq("id", user.id)
        .single();


    if (error || !profile) {

      await supabaseClient.auth.signOut();

      document.getElementById("loginMessage").textContent =
        "Profile not found.";

      return;
    }


    // ADMIN CHECK
    if (profile.role !== "admin") {

      await supabaseClient.auth.signOut();

      document.getElementById("loginMessage").textContent =
        "Access denied. You are not an admin.";

      return;
    }


    // Show dashboard
    document
      .getElementById("loginSection")
      .classList.add("hidden");

    document
      .getElementById("dashboard")
      .classList.remove("hidden");

    document
      .getElementById("adminEmail")
      .textContent = user.email;


    loadBlogs();

  }


  // ==============================
  // LOGOUT
  // ==============================

  async function logout() {

    await supabaseClient.auth.signOut();

    location.reload();

  }


  // ==============================
  // LOAD BLOGS
  // ==============================

  async function loadBlogs() {

    const { data, error } =
      await supabaseClient
        .from("blogs")
        .select("*")
        .order("created_at", {
          ascending: false
        });


    if (error) {

      document.getElementById("blogList").innerHTML =
        "<p>Error loading blogs: " +
        escapeHtml(error.message) +
        "</p>";

      return;
    }


    const blogs = data || [];


    // Statistics
    const published =
      blogs.filter(b => b.status === "published").length;

    const drafts =
      blogs.filter(b => b.status === "draft").length;


    document.getElementById("blogCount")
      .textContent = blogs.length;

    document.getElementById("publishedCount")
      .textContent = published;

    document.getElementById("draftCount")
      .textContent = drafts;


    // No blogs
    if (blogs.length === 0) {

      document.getElementById("blogList").innerHTML =
        "<p>No blogs available.</p>";

      return;
    }


    let html = "";


    blogs.forEach(blog => {

      html += `

        <div class="blog">

          <h3>
            ${escapeHtml(blog.title)}
          </h3>

          <p>
            <strong>Category:</strong>
            ${escapeHtml(blog.category || "General")}
          </p>

          <p>
            <strong>Status:</strong>
            ${escapeHtml(blog.status)}
          </p>

          <p>
            ${escapeHtml(blog.excerpt || "")}
          </p>

          <button
            class="edit"
            onclick="editBlog(${blog.id})">
            Edit
          </button>

          <button
            class="danger"
            onclick="deleteBlog(${blog.id})">
            Delete
          </button>

          ${
            blog.status === "published"
            ?
            `<button
              class="secondary"
              onclick="changeStatus(${blog.id}, 'draft')">
              Move to Draft
            </button>`
            :
            `<button
              class="primary"
              onclick="changeStatus(${blog.id}, 'published')">
              Publish
            </button>`
          }

        </div>

      `;

    });


    document.getElementById("blogList").innerHTML =
      html;

  }


  // ==============================
  // SAVE BLOG
  // ==============================

  async function saveBlog() {

    const title =
      document.getElementById("title").value.trim();

    const slug =
      document.getElementById("slug").value.trim();

    const excerpt =
      document.getElementById("excerpt").value.trim();

    const content =
      document.getElementById("content").value.trim();

    const image_url =
      document.getElementById("image_url").value.trim();

    const category =
      document.getElementById("category").value.trim();

    const author =
      document.getElementById("author").value.trim();

    const status =
      document.getElementById("status").value;

    const editId =
      document.getElementById("editId").value;


    if (!title || !content) {

      document.getElementById("blogMessage").textContent =
        "Title and content are required.";

      return;
    }


    const blogData = {

      title: title,
      slug: slug || null,
      excerpt: excerpt || null,
      content: content,
      image_url: image_url || null,
      category: category || null,
      author: author || "EV Technician Hub",
      status: status,
      updated_at: new Date().toISOString()

    };


    let result;


    // EDIT
    if (editId) {

      result =
        await supabaseClient
          .from("blogs")
          .update(blogData)
          .eq("id", editId);

    }

    // NEW
    else {

      result =
        await supabaseClient
          .from("blogs")
          .insert([blogData]);

    }


    if (result.error) {

      document.getElementById("blogMessage").textContent =
        "Error: " + result.error.message;

      return;
    }


    document.getElementById("blogMessage").textContent =
      editId
      ? "Blog updated successfully."
      : "Blog added successfully.";


    clearForm();

    loadBlogs();

  }


  // ==============================
  // EDIT BLOG
  // ==============================

  async function editBlog(id) {

    const { data, error } =
      await supabaseClient
        .from("blogs")
        .select("*")
        .eq("id", id)
        .single();


    if (error) {

      alert("Error loading blog: " + error.message);

      return;
    }


    document.getElementById("formTitle").textContent =
      "Edit Blog";


    document.getElementById("editId").value =
      data.id;

    document.getElementById("title").value =
      data.title || "";

    document.getElementById("slug").value =
      data.slug || "";

    document.getElementById("excerpt").value =
      data.excerpt || "";

    document.getElementById("content").value =
      data.content || "";

    document.getElementById("image_url").value =
      data.image_url || "";

    document.getElementById("category").value =
      data.category || "";

    document.getElementById("author").value =
      data.author || "EV Technician Hub";

    document.getElementById("status").value =
      data.status || "draft";


    window.scrollTo({
      top: 0,
      behavior: "smooth"
    });

  }


  // ==============================
  // DELETE BLOG
  // ==============================

  async function deleteBlog(id) {

    const confirmDelete =
      confirm("Are you sure you want to delete this blog?");


    if (!confirmDelete) return;


    const { error } =
      await supabaseClient
        .from("blogs")
        .delete()
        .eq("id", id);


    if (error) {

      alert("Delete failed: " + error.message);

      return;
    }


    loadBlogs();

  }


  // ==============================
  // CHANGE STATUS
  // ==============================

  async function changeStatus(id, status) {

    const { error } =
      await supabaseClient
        .from("blogs")
        .update({
          status: status,
          updated_at: new Date().toISOString()
        })
        .eq("id", id);


    if (error) {

      alert("Status update failed: " + error.message);

      return;
    }


    loadBlogs();

  }


  // ==============================
  // CLEAR FORM
  // ==============================

  function clearForm() {

    document.getElementById("formTitle").textContent =
      "Add New Blog";

    document.getElementById("editId").value = "";

    document.getElementById("title").value = "";

    document.getElementById("slug").value = "";

    document.getElementById("excerpt").value = "";

    document.getElementById("content").value = "";

    document.getElementById("image_url").value = "";

    document.getElementById("category").value = "";

    document.getElementById("author").value =
      "EV Technician Hub";

    document.getElementById("status").value =
      "draft";

    document.getElementById("blogMessage").textContent = "";

  }


  // ==============================
  // SECURITY: HTML ESCAPE
  // ==============================

  function escapeHtml(value) {

    return String(value ?? "")
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");

  }


  // ==============================
  // START
  // ==============================

  checkAdmin();

</script>

</body>
</html>
